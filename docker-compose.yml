services:
  db:
    image: postgres:16-alpine
    container_name: studymate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate_dev
      POSTGRES_DB: studymate
    ports:
      - "5432:5432"
    volumes:
      - studymate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studymate_pgdata:
